
# Task name - used to pick the class to load
task_name: ${task.name}
# experiment name. defaults to name of training config
experiment: ''

# if set to positive integer, overrides the default number of environments
num_envs: ''

# seed - set to -1 to choose random seed
seed: 42
# set to True for deterministic performance
torch_deterministic: False

# set the maximum number of learning iterations to train for. overrides default per-environment setting
max_iterations: ''

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: 'cuda:0'
graphics_device_id: 0

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# used to set checkpoint path
checkpoint: ''
# set sigma when restoring network
sigma: ''
# set to True to use multi-gpu training
multi_gpu: False

wandb_activate: True
wandb_group: ''
wandb_name: ${train.params.config.name}
wandb_entity: ''
wandb_project: ''
wandb_tags: []
wandb_logcode_dir: '' 

capture_video: False
capture_video_freq: 1464
capture_video_len: 100
force_render: True

# disables rendering
headless: False

# set default task and default training config based on task
defaults:
  - task: meta-world-v2
  - train: ${task}PPO
  - hydra/job_logging: disabled

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .

# used to overwrite task id for single task training
task_id: [0]
task_counts: [4096]
init_at_random_progress: True
exempted_tasks: []
record_videos: False
termination_on_success: True
reward_scale: 1.0

sparse_reward: False

algorithm: mt_a2c_continuous  # pcgrad_a2c

famo_eps: 1e-4
famo_gamma: 1e-5
famo_w_lr: 1e-3
famo_norm_w_grad: True

operate_actor_gradient: False

fixed: True # set to True to fix the object and target positions across resets i.e the 'fixed' setting

nstep: 1
gradient_steps_per_itr: 1
batch_size: 256
minibatch_size: 32678

units: [256, 128, 64] # units in the actor critic network
critic_hidden_dim: 256

learn_task_embedding: False
horizon: 32

dynamic_task_distribution:
  enabled: False  # Set to True to enable dynamic task distribution
  type: "performance_based"  # Options: "performance_based", "schedule_based", "curriculum"
  update_frequency: 1000  # How often to update (in steps)
  
  # Performance-based options
  performance_based:
    success_rate_threshold: 0.8  # Tasks above this get fewer environments
    min_task_weight: 0.1
    max_task_weight: 5.0
    adaptation_rate: 0.1  # How quickly to adapt weights
    
  # Schedule-based options  
  schedule_based:
    schedule:
      0: [410, 410, 410, 410, 410, 410, 409, 409, 409, 409]  # Initial
      1000: [300, 300, 300, 300, 300, 300, 600, 600, 600, 600]  # Focus on hard
      2000: [200, 200, 200, 200, 200, 200, 800, 800, 800, 800]  # Even more focus
      
  # Curriculum options
  curriculum:
    easy_tasks: [0, 1, 2, 3, 4, 5]  # Task indices for easy tasks
    hard_tasks: [6, 7, 8, 9]        # Task indices for hard tasks
    initial_easy_weight: 1.0
    initial_hard_weight: 0.5
    final_easy_weight: 0.2
    final_hard_weight: 1.0
    transition_steps: 10000